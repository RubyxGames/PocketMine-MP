# Main configuration file for PocketMine-MP
# These settings are the ones that cannot be included in server.properties
# Some of these settings are safe, others can break your server if modified incorrectly
# New settings/defaults won't appear automatically in this file when upgrading.

settings:
  #Whether to send all strings translated to server locale or let the device handle them
  force-language: false
  shutdown-message: "Server closed"
  #Allow listing plugins via Query
  query-plugins: true
  #Enable plugin and core profiling by default
  enable-profiling: false
  #Will only add results when tick measurement is below or equal to given value (default 20)
  profile-report-trigger: 20
  #Number of AsyncTask workers.
  #Used for plugin asynchronous tasks, world generation, compression and web communication.
  #Set this approximately to your number of cores.
  #If set to auto, it'll try to detect the number of cores (or use 2)
  async-workers: auto
  #Whether to allow running development builds. Dev builds might crash, break your plugins, corrupt your world and more.
  #It is recommended to avoid using development builds where possible.
  enable-dev-builds: false

memory:
  #Global soft memory limit in megabytes. Set to 0 to disable
  #This will trigger low-memory-triggers and fire an event to free memory when the usage goes over this
  global-limit: 0

  #Main thread soft memory limit in megabytes. Set to 0 to disable
  #This will trigger low-memory-triggers and fire an event to free memory when the usage goes over this
  main-limit: 0

  #Main thread hard memory limit in megabytes. Set to 0 to disable
  #This will stop the server when the limit is surpassed
  main-hard-limit: 1024

  #AsyncWorker threads' hard memory limit in megabytes. Set to 0 to disable
  #This will crash the task currently executing on the worker if the task exceeds the limit
  #NOTE: THIS LIMIT APPLIES PER WORKER, NOT TO THE WHOLE PROCESS.
  async-worker-hard-limit: 256

  #Period in ticks to check memory (default 1 second)
  check-rate: 20

  #Continue firing low-memory-triggers and event while on low memory
  continuous-trigger: true

  #Only if memory.continuous-trigger is enabled. Specifies the rate in memory.check-rate steps (default 30 seconds)
  continuous-trigger-rate: 30

  garbage-collection:
    #Period in ticks to fire the garbage collector manually (default 30 minutes), set to 0 to disable
    #This only affects the main thread. Other threads should fire their own collections
    period: 36000

  #Settings controlling memory dump handling.
  memory-dump:
    #Dump memory from async workers as well as the main thread. If you have issues with segfaults when dumping memory, disable this setting.
    dump-async-worker: true

  max-chunks:
    #Cap maximum render distance per player when low memory is triggered. Set to 0 to disable cap.
    chunk-radius: 4

network:
  #Threshold for batching packets, in bytes. Only these packets will be compressed
  #Set to 0 to compress everything, -1 to disable.
  batch-threshold: 256
  #Compression level used when sending batched packets. Higher = more CPU, less bandwidth usage
  compression-level: 6
  #Use AsyncTasks for compression during the main game session. Increases latency, but may reduce main thread load
  async-compression: false
  #Threshold for async compression, in bytes. Only packets larger than this will be compressed asynchronously
  #Due to large overhead of AsyncTask, async compression isn't worth it except for large packets
  async-compression-threshold: 10000
  #Experimental. Use UPnP to automatically port forward
  #DEPRECATED: This only forwards the RakNet port and will be removed once RakNet support is removed.
  #NetherNet handles NAT traversal via STUN/TURN relays (transport.nethernet.ice-servers) and supports reverse proxies or tunnels for signaling.
  upnp-forwarding: false
  #Maximum size in bytes of packets sent over the network (default 1492 bytes). Packets larger than this will be
  #fragmented or split into smaller parts. Clients can request MTU sizes up to but not more than this number.
  #DEPRECATED: Only applies to RakNet. See transport.nethernet.mtu for NetherNet.
  max-mtu-size: 1492
  #Enable encryption of Minecraft network traffic. This has an impact on performance, but prevents hackers from stealing sessions and pretending to be other players.
  #DO NOT DISABLE THIS unless you understand the risks involved.
  #DEPRECATED: This setting will be removed in a future version once the RakNet support is removed.
  enable-encryption: true

  # Adaptive QoS: temporarily lower view distance for high-latency players (see docs/adaptive-qos.md).
  adaptive-qos:
    enabled: false
    ping-soft-ms: 150
    ping-hard-ms: 300
    recover-ms: 100
    soft-view-distance: 6
    hard-view-distance: 4
    min-view-distance: 3
    check-interval-ticks: 40

# Graceful stop: refuse joins, wait up to N seconds, then forceShutdown. 0 = immediate.
shutdown:
  drain-seconds: 10

# Soft chat/command rate limits (no kick). See docs/ops.md.
abuse-limits:
  chat:
    enabled: true
    max-per-second: 2
    burst: 4
  commands:
    enabled: true
    max-per-second: 4
    burst: 8

# Data-Driven UI (Bedrock 1.26+). See docs/plugin-api-ddui.md and docs/DDUI_WIRE_CONTRACT.md.
ddui:
  enabled: true
  # Delay before opening a new DDUI screen after closing another (avoids client USER_BUSY).
  replace-delay-ticks: 20
  # Auto-close server-side tracking after this many ticks (0 = disabled).
  session-timeout-ticks: 6000
  max-inbound-updates-per-tick: 32
  max-outbound-updates-per-tick: 64
  # Theme API: alias → styleId from resource pack ddui/styling/*.json (see docs/DDUI_THEMING.md).
  default-theme: rubyx:classic
  themes:
    rubyx:classic:
      style-id: ""

# Session recording (JSONL gameplay/event log). See docs/session-recording.md.
session-recording:
  enabled: false
  auto-record-all: false
  directory: session_recordings
  move-sample-ticks: 5
  record-packet-ids: false
  max-file-mb: 64

transport:
  #Network transport(s) used for player connections. Accepts a comma-separated list (e.g. nethernet,raknet), up to 8 entries.
  #Built-in options: raknet, nethernet. Plugins may register additional transports.
  #Default is NetherNet-only. Use "nethernet,raknet" while older clients still need RakNet.
  name: nethernet
  #Settings for the NetherNet (WebRTC) transport.
  nethernet:
    #Path to the persistent identity key, relative to the data directory.
    #Clients trust this key upon their first join.
    #Changing this file will prompt players to re-verify on their next connection.
    key-file: nethernet.key

    #Operator domain or server name included in identity assertions sent to clients.
    #Leave empty to use the server MOTD (with formatting codes stripped).
    #Clients pin the public key rather than this name, so changing it does not require players to re-verify.
    identity-domain:

    #Enables ICE UDP multiplexing so connections share a single UDP socket.
    #Only uses a fixed port if port-range specifies a single port; otherwise, an arbitrary port is assigned.
    #NOTE: Cannot be used with TURN servers.
    ice-udp-mux: false

    #UDP port range for connections.
    #Parsed as [min, max], e.g. [19132, 19140]. Leave empty to use any available port.
    port-range:

    #Maximum size in bytes of IP packets sent to clients. Not negotiated, so only raise it if every client's network path allows it.
    mtu: 1200

    #IP addresses advertised to clients for peer connections instead of locally gathered interface addresses.
    #Useful when behind a 1:1 NAT (specify the public IP) or when the server has unreachable internal interfaces.
    #Addresses are announced using the local bound port; 1:1 port forwarding without port translation is required.
    #Only affects HTTP signaling; LAN discovery always advertises local addresses. Leave empty to advertise all gathered addresses.
    advertise-addresses:
    #Example:
    #- 203.0.113.10

    #STUN/TURN ICE servers for NAT traversal and relay.
    #Unreachable servers will delay connection establishment until candidate gathering times out.
    #A public STUN server is enabled by default so players behind NAT can often connect without a private TURN.
    #For strict CGNAT/symmetric NAT, add a TURN server (credentials required).
    ice-servers:
      - type: stun
        host: stun.l.google.com
        port: 19302
      #port defaults to 3478 if omitted.
      #Example TURN:
      #- type: turn
      #  host: turn.example.com
      #  port: 3478
      #  username: <username for the TURN server>
      #  password: <password for the TURN server>

    #Built-in signaling channels: HTTP signaling endpoint (GET/POST /v1/join) and LAN broadcast discovery.
    builtin-signaling:
      #Disable if signaling is handled externally (e.g. by a custom signaling plugin using NetherNetInterface::acceptOffer()).
      #If disabled without an alternative signaling mechanism, clients cannot connect.
      enabled: true

      #TCP port for HTTP signaling. Set to 0 to use server-port from server.properties.
      #Only modify this when behind a reverse proxy that forwards signaling traffic to a custom port.
      port: 0

      #TLS for the HTTP signaling endpoint (plain HTTP is redirected to HTTPS when set).
      #Leave certificate and key empty for plain HTTP (typical behind a TLS reverse proxy).
      #Paths are relative to the data directory, e.g. nethernet-signaling.crt / nethernet-signaling.key
      tls:
        #Path to PEM certificate or certificate chain file (required together with key).
        certificate:
        #Path to PEM private key file (required together with certificate).
        key:
        #Optional private key passphrase, or file:<path> to read from a file.
        passphrase:

      #Enable when HTTP signaling is behind a reverse proxy (e.g. nginx, Caddy, Cloudflare).
      #Allows resolving the client's real IP from forwarded headers for features like TURN relays.
      reverse-proxy:
        enabled: false
        #Header the proxy sets the client's IP in (e.g. X-Forwarded-For, X-Real-IP, CF-Connecting-IP).
        header: X-Forwarded-For
        #List of trusted reverse proxy IP addresses or CIDR blocks.
        #Forwarded headers from unlisted addresses are ignored to prevent IP address spoofing.
        #At least one entry is required when enabled.
        trusted-ips:
        #Example:
        #- 127.0.0.1
        #- 10.0.0.2

debug:
  #If > 1, it will show debug messages in the console
  level: 1

player:
  #Choose whether to enable player data saving.
  save-player-data: true
  #If true, checks that joining players' Xbox user ID (XUID) match what was previously recorded.
  #This also prevents non-XBL players using XBL players' usernames to steal their data on servers with xbox-auth=off.
  verify-xuid: true
  # Client movement safety (not full anti-cheat). See docs/ops.md.
  movement:
    enabled: true
    max-blocks-per-move: 15
    max-blocks-per-tick: 10.0
    # Also send CorrectPlayerMovePredictionPacket on rubberband (not full prediction AC)
    send-prediction-correction: true

level-settings:
  #The default format that worlds will use when created
  default-format: leveldb

# Durable saves for small files / optional region fsync. See docs/ops.md.
world:
  save:
    fsync: true
    region-fsync: false
    leveldb-sidecar: true
  light:
    # true = coalesce light recalcs until end of world tick (default)
    # false = execute immediately after each updateAllLight (more responsive, more CPU)
    defer-updates: true

# Prometheus-style metrics (file and/or scrape). See docs/ops.md.
metrics:
  enabled: false
  file: true
  bind: "" # e.g. 127.0.0.1:9090

chunk-sending:
  #To change server normal render distance, change view-distance in server.properties.
  #Amount of chunks sent to players per tick
  per-tick: 4
  #Radius of chunks that need to be sent before spawning the player
  spawn-radius: 4

chunk-ticking:
  #Radius of chunks around a player to tick
  tick-radius: 3
  #Number of blocks inside ticking areas' subchunks that get ticked every tick. Higher values will accelerate events
  #like tree and plant growth, but at a higher performance cost.
  blocks-per-subchunk-per-tick: 3
  #IDs of blocks not to perform random ticking on.
  disable-block-ticking:
    #- grass
    #- ice
    #- fire
  #Unused chunk unload (saves RAM; may add reload latency when players return). See docs/multiworld.md.
  unload:
    enabled: true
    #Max chunks unloaded per world tick from the idle queue
    max-chunks-per-tick: 16
    #Ticks an unused chunk must stay idle before it becomes eligible (~10s at 20 TPS)
    idle-ticks: 200

chunk-generation:
  #Max. amount of chunks in the waiting queue to be populated
  population-queue-size: 32

ticks-per:
  autosave: 6000

auto-report:
  #Send crash reports for processing
  enabled: true
  send-code: true
  send-settings: true
  send-phpinfo: false
  use-https: true
  host: crash.axolotl-pm.org

anonymous-statistics:
  #Sends anonymous statistics for data aggregation, plugin usage tracking
  enabled: false #TODO: re-enable this when we have a new stats host
  host: stats.pocketmine.net

auto-updater:
  enabled: true
  on-update:
    warn-console: true
  #Can be development, alpha, beta or stable.
  preferred-channel: stable
  #If using a development version, it will suggest changing the channel
  suggest-channels: true
  host: update.axolotl-pm.org

timings:
  #Choose the host to use for viewing your timings results.
  host: timings.axolotl-pm.org

console:
  #Whether to accept commands via the console. If disabled, anything typed on the console will be ignored.
  #Useful to save resources on headless servers where the console is never used (e.g. hosted server, Docker, etc.)
  enable-input: true
  #Choose whether to enable server stats reporting on the console title.
  #NOTE: The title ticker will be disabled regardless if console colours are not enabled.
  title-tick: true

aliases:
  ##This section allows you to add, remove or remap command aliases.
  ##A single alias can call one or more other commands (or aliases).
  ##Aliases defined here will override any command aliases declared by plugins or PocketMine-MP itself.

  ##To remove an alias, set it to [], like so (note that prefixed aliases like "pocketmine:stop" will remain and can't
  ##be removed):
  #stop: []

  ##Commands are not removed, only their aliases. You can still refer to a command using its full (prefixed)
  ##name, even if all its aliases are overwritten. The full name is usually something like "pocketmine:commandname" or
  ##"pluginname:commandname".
  #abort: [pocketmine:stop]

  ##To add an alias, list the command(s) that it calls:
  #showtheversion: [version]
  #savestop: [save-all, stop]

  ##To invoke another command with arguments, use $1 to pass the first argument, $2 for the second etc:
  #giveadmin: [op $1] ## `giveadmin alex` -> `op alex`
  #kill: [suicide, say "I tried to kill $1"] ## `kill alex` -> `suicide` + `say "I tried to kill alex"`
  #giverandom: [give $1 $2, say "Someone has just received a $2!"] ## `giverandom alex diamond` -> `give alex diamond` + `say "Someone has just received a diamond!"`

  ##To make arguments mandatory (so that the command fails if they are not provided), use $$, e.g. $$1, $$2:
  #makeadmin: [op $$1] ## `makeadmin alex` -> `op alex`, `makeadmin` with no arguments = error

  ##To pass through a range of arguments, put a - (hyphen) after the index:
  #tpalias: [tp $1-] ## `tpalias 256 70 256` -> `tp 256 70 256` - this passes arguments 1 and everything after it to the `tp` command

  ##To change an existing command alias and make it do something else:
  #tp: [suicide]

worlds:
  #These settings will override the generator set in server.properties and allows loading multiple worlds
  #Example:
  #world:
  # seed: 404
  # generator: FLAT
  # preset: 2;bedrock,59xstone,3xdirt,grass;1

plugins:
  security-scan: true
  security-scan-mode: warn
  #Setting this to true will cause the legacy structure to be used where plugin data is placed inside the --plugins dir.
  #False will place plugin data under plugin_data under --data.
  #This option exists for backwards compatibility with existing installations.
  legacy-data-dir: false
  # /plugin install <https-url> downloads a .phar or folder-plugin .zip into plugins/ (restart required to load).
  install:
    enabled: true
    max-mb: 32
